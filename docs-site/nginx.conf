# nginx inside the `docs` container. The app's proxy (deploy/nginx.conf) forwards /docs/ here
# unchanged, so the site is stored under /usr/share/nginx/html/docs.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A directory URL typed without its trailing slash gets a RELATIVE redirect. An absolute one
    # would name this container ("http://docs/...") or port 80, neither of which the browser can
    # reach through the proxy on 8080.
    absolute_redirect off;

    location /docs/ {
        try_files $uri $uri/ =404;
    }

    error_page 404 /docs/404.html;
}
