# MRR AI documentation site. Source pages live in ../docs (plain Markdown that also reads well on
# GitHub); this file only says how to build them. Build: `uv run mkdocs build --strict`.
# Preview: `uv run mkdocs serve`. Full guide: docs/how-to/work-on-these-docs.md.
site_name: MRR AI documentation
site_description: How the AI Medical Record Review app works, how to run it, and how to change it.
# Only the PATH matters: the box serves the site at /docs/ behind the app's nginx proxy, and the
# 404 page builds its asset links from this path. The host is a placeholder.
site_url: http://localhost:8080/docs/
repo_url: https://github.com/gesco-healthcare-support/ai-medical-record-review
repo_name: ai-medical-record-review
edit_uri: edit/main/docs/
docs_dir: ../docs
site_dir: site

# Every warning is an error: a broken link, a missing anchor or a page left out of `nav` fails the
# build, locally and in CI. That is what keeps the site from rotting quietly.
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# docs/plans/ and docs/backlog.md are local working files (gitignored) and never part of the site.
exclude_docs: |
  plans/
  backlog.md

theme:
  name: material
  # System fonts: no request to Google Fonts from a reader's browser.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# Every page must be listed (validation.omitted_files). Titles come from each page's own heading.
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/first-day.md
  - How-to guides:
      - Running it:
          - how-to/run-the-app-locally.md
          - how-to/run-the-tests.md
          - how-to/deploy-to-the-server.md
          - how-to/back-up-and-restore.md
          - how-to/manage-users-and-admins.md
          - how-to/diagnose-a-stuck-or-failed-job.md
          - how-to/troubleshoot-a-summary.md
          - how-to/switch-model-backends.md
      - Changing it:
          - how-to/add-or-change-a-category.md
          - how-to/change-a-summary-prompt-or-rule.md
          - how-to/create-a-database-migration.md
          - how-to/add-an-api-route-or-export.md
          - how-to/add-a-job-kind-or-stage.md
          - how-to/extend-the-frontend.md
          - how-to/work-on-these-docs.md
  - Reference:
      - reference/http-api.md
      - reference/errors-and-messages.md
      - reference/configuration.md
      - reference/model-calls-by-stage.md
      - reference/job-and-document-states.md
      - reference/data-model.md
      - reference/migrations.md
      - reference/export-formats.md
      - reference/compose-services.md
      - reference/ci-and-merge-gates.md
      - reference/scripts.md
      - reference/frontend-routes-and-data.md
      - reference/design-system.md
      - reference/glossary.md
  - Explanation:
      - explanation/architecture.md
      - explanation/pipeline-and-jobs.md
      - explanation/ocr-and-page-text.md
      - explanation/segmentation.md
      - explanation/categorization.md
      - explanation/duplicate-detection.md
      - explanation/summarization.md
      - explanation/deliverable-layout.md
      - explanation/exports-and-downloads.md
      - explanation/model-providers.md
      - explanation/configuration-model.md
      - explanation/auth-and-access.md
      - explanation/frontend-workbench.md
