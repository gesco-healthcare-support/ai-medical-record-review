# Same-origin reverse proxy: /api -> FastAPI, everything else -> Next.js. The browser only ever
# talks to this proxy, so the session cookie stays first-party and there is no CORS.
#
# ON THE SERVER: add TLS here (listen 443 ssl; ssl_certificate ...; redirect 80 -> 443) and set
# ENVIRONMENT=prod in .env so the session cookie is marked Secure. Over plain http (local) keep
# ENVIRONMENT=dev, or the Secure cookie will not be stored and login will silently fail.

# Download log (#390). A native download that fails shows only in the reviewer's browser, so each one gets
# its own line here, from nginx's own counters: bytes actually written to the browser, the size the API
# declared, whether the request completed ("OK", or empty when the browser left), and the time. It names the
# record and only the first 8 characters of the download token, and replaces the standard access line for
# these URLs, so no nginx ACCESS line carries the whole link. nginx's ERROR log still quotes the full request
# line when the upstream fails (a 502/504) - as uvicorn's own access log does for every request. A token alone
# downloads nothing: it works only with its owner's signed-in session.
map $uri $mrr_dl_document {
    ~^/api/documents/([^/]+)/downloads/ $1;
    default -;
}
map $uri $mrr_dl_token8 {
    "~^/api/documents/[^/]+/downloads/([A-Za-z0-9_-]{8})" $1;   # quoted: nginx reads a bare { as a block
    default -;
}
log_format mrr_download 'download status=$status document=$mrr_dl_document token=$mrr_dl_token8 '
                        'sent=$body_bytes_sent of=$sent_http_content_length '
                        'completed=$request_completion time=$request_time';

server {
    listen 80;
    server_name _;
    # Medical records can be very large (a 2600-page image-heavy PDF is ~380 MB). Cap high enough
    # to accept those; the api streams the body to disk in 1 MB chunks so RAM stays bounded.
    client_max_body_size 500m;
    client_body_timeout 300s;    # allow a large upload to finish over a slower link

    # Docker's embedded DNS. Resolving the upstream through a variable forces nginx to re-resolve
    # per request, so recreating the api/web container (new IP on `docker compose up -d`) never
    # leaves the proxy holding a stale IP - otherwise the next request 502s until the proxy is
    # restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # sync AI routes (export, bundle summarize) can run long
    }

    # Prepared exports (#389). Unbuffered, so bytes reach the browser at its own pace and the API sees it
    # leave (and so a patient file is never copied into nginx's temp files). The API also sends
    # `X-Accel-Buffering: no`; either one alone is enough, so deploying one before the other still works.
    location ~ ^/api/documents/[^/]+/downloads/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        access_log /var/log/nginx/access.log mrr_download;
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
