# Full deployable stack for the Next.js + FastAPI re-platform: the whole app in one command,
# entirely on local/in-house infrastructure (no cloud). The SAME file runs on the in-house LAN
# server - only .env changes (ENVIRONMENT=prod + TLS on the proxy). The dev-only Postgres/Redis
# for host-process development live in docker-compose.dev.yml; THIS file is the complete app.
#
# The one external call is Vertex AI (LLM/VLM inference); everything else runs on your metal.
#
# Setup / runbook: see docs/plans/2026-07-16-p8-local-stack.md.
name: mrr

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://mrr:${POSTGRES_PASSWORD:-mrr_local_only}@postgres:5432/mrr
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
  SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:?set SECURITY_PASSWORD_SALT in .env (the real Flask salt)}
  UPLOAD_FOLDER: /app/uploads
  GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-true}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  # Pin Tesseract/OpenMP to a single thread. Tesseract 5.x is OpenMP-enabled, and concurrent
  # tesseract processes (the verify pass OCRs boundary pages on up to CLASSIFY_WORKERS threads)
  # deadlock on the shared CPU when this is unset - the reproduced "stuck on verifying" forever-
  # hang. Proven: 6-thread OCR hammer goes 0/60 (deadlock) -> 60/60 with the limit set. Harmless
  # on the api/web tiers (they never OCR).
  OMP_THREAD_LIMIT: "1"
  OMP_NUM_THREADS: "1"
  # Vertex pacing. These MUST be named here to have any effect: compose reads .env only for ${VAR}
  # substitution inside this file, so a key added to .env and not referenced here never reaches a
  # container. Found the hard way on 2026-07-31 - VERTEX_MAX_RPM=20 and SEGMENT_WINDOW_WORKERS=1 were
  # added to the server .env, the containers were recreated, and both processes still reported 60 and
  # 3. Fallbacks mirror app/config.py so an unset key behaves exactly as before.
  VERTEX_MAX_RPM: ${VERTEX_MAX_RPM:-60}
  SEGMENT_WINDOW_WORKERS: ${SEGMENT_WINDOW_WORKERS:-3}
  # Row-level concurrency inside ONE summarize job (summarize_document's ThreadPoolExecutor), and
  # the classify/verify pool. Named here for the same reason as every block in this file: an
  # unreferenced key never reaches a container.
  #
  # PIPELINE_WORKERS is the binding constraint on summarize throughput, not the Vertex quota.
  # Measured 2026-08-03: 7.8 accepted calls/min against a VERTEX_MAX_RPM of 20, i.e. the shared
  # bucket sitting at ~39% utilisation - two concurrent chains at ~15.4s per call is exactly
  # 7.8/min. By Little's Law the saturation point for a 20 rpm budget is 20/60 * 15.4 = ~5
  # concurrent rows, so 5 fills the existing budget without raising it.
  #
  # Do NOT push this far past the saturation point. rate_limit.acquire() abandons its wait after
  # MAX_ACQUIRE_WAIT_S (300s) and proceeds anyway, so enough queued callers stop being rate limited
  # at all. At 3 summarize workers x 5 chains against 20 rpm the mean wait is ~30s, well inside it.
  #
  # CLASSIFY_WORKERS also drives concurrent Tesseract processes in the verify pass - see the
  # OMP_THREAD_LIMIT note above, which is what stops those deadlocking.
  PIPELINE_WORKERS: ${PIPELINE_WORKERS:-2}
  CLASSIFY_WORKERS: ${CLASSIFY_WORKERS:-4}
  # Concurrency of the ONE-TIME per-page OCR pass (services/page_text.populate_document). Named here
  # for the same reason as everything above: an unreferenced key never reaches a container.
  #
  # Pure Tesseract CPU, so it is bounded by cores rather than by the Vertex budget - it spends no
  # quota at all. The box has 8 cores and also runs six RQ workers, postgres, redis, api and web, so
  # the default leaves headroom rather than saturating. OMP_THREAD_LIMIT=1 above is what makes
  # several concurrent tesseract processes safe; without it they deadlock on the shared CPU.
  PAGE_TEXT_WORKERS: ${PAGE_TEXT_WORKERS:-4}
  # Which vendor answers the summarize stage (body, title, audit). Named here now, while the only
  # valid value is "gemini", so the key is live the day a second provider exists - rather than being
  # added later and silently doing nothing, which is what happened to VERTEX_MAX_RPM and
  # PIPELINE_WORKERS. Fallback mirrors app/config.py.
  SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-gemini}
  # Read ONLY when SUMMARY_PROVIDER=openai. No fallbacks: the app refuses to start if the provider
  # is openai and any of these is unset, because a silent default model is how something unvalidated
  # reaches production. Harmless empty strings while the provider stays gemini.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  SUMMARY_BODY_MODEL: ${SUMMARY_BODY_MODEL:-}
  SUMMARY_TITLE_MODEL: ${SUMMARY_TITLE_MODEL:-}
  AUDIT_MODEL: ${AUDIT_MODEL:-}
  # PHI gate: a signed BAA alone does not permit sending records to OpenAI - Zero Data Retention
  # must also be approved on the ORGANIZATION. Production refuses to start without this explicit
  # acknowledgement, so no future box can start sending records to an org nobody checked.
  OPENAI_ZDR_ACKNOWLEDGED: ${OPENAI_ZDR_ACKNOWLEDGED:-false}
  # Retry budget. Also inert until named here, and .env.example has advertised both since 2026-07-21,
  # so anyone following it would set a value that did nothing. A setting the app reads should be
  # settable: the way to run 8 retries is to put 8 in .env, not to have the file silently ignored.
  # The worker-scaling plan's advice still stands - raising retries above 8 lengthens the block
  # without improving the odds, since a job already burns ~17 minutes before reporting failure - but
  # that is a reason to choose 8, not a reason to hide the dial.
  GENAI_MAX_RETRIES: ${GENAI_MAX_RETRIES:-8}
  GENAI_RETRY_MAX_DELAY: ${GENAI_RETRY_MAX_DELAY:-30}
  # Duplicate-detection thresholds, named here for the same reason as the two blocks above. #66 shipped
  # these three settings and its own body advertised them as the way to loosen or disable the new
  # accuracy gate without a code change - which they were not, since an unreferenced key never reaches
  # a container. It matters for these specifically because the gate decides what a reviewer is SHOWN:
  # if it proves too strict on a real record, editing .env and recreating is the only mitigation that
  # does not need a deploy. Set both overrides to 1.1 to restore the pre-#66 behaviour of sending every
  # candidate to the model. Fallbacks mirror app/config.py, so an unset key behaves exactly as now.
  DUPE_JACCARD_THRESHOLD: ${DUPE_JACCARD_THRESHOLD:-0.70}
  DUPE_SIMILARITY_OVERRIDE: ${DUPE_SIMILARITY_OVERRIDE:-0.90}
  DUPE_MODEL_OVERRIDE: ${DUPE_MODEL_OVERRIDE:-0.95}
  # Grace period before the Stop button offers a hard "Force stop". Named here for the same reason as
  # every block above: an unreferenced key never reaches a container. The API reads it to tell the UI
  # how long to wait, so a mismatch between processes would make the button offer Force stop at a
  # different moment than the server expects.
  JOB_CANCEL_GRACE_SECONDS: ${JOB_CANCEL_GRACE_SECONDS:-10}
  # TESSERACT_CMD is deliberately NOT passed through. It is set in .env for the Windows HOST, and
  # injecting a "C:\..." path here would point the containers' pytesseract at a binary that does not
  # exist, breaking OCR everywhere. The Linux images have tesseract on PATH already.

services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: mrr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrr_local_only}
      POSTGRES_DB: mrr
    ports:
      - "5433:5432" # host 5433 to avoid clashing with the dev stack (docker-compose.dev.yml) on 5432
    volumes:
      - mrr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrr -d mrr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7
    # Persistence OFF: the queue carries only non-PHI job ids; no RDB/AOF on disk (HIPAA).
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UV_EXTRAS: "--extra docs"
        # The commit this image is built from, stamped onto every job row so a stored summary can be
        # traced to the code that produced it. Defaults to "unknown" so a local build is honestly
        # labelled rather than mislabelled; deploy sets it (see docs/RUNBOOK.md).
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mrr-backend-web
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    volumes:
      - mrr_uploads:/app/uploads
      - ./instance:/app/instance:ro # the legacy SQLite, read for the one-time data migration
      - ./secrets:/secrets:ro # optional Vertex service-account key (see .env.example)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  segment-worker:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UV_EXTRAS: "--extra docs --extra classifier" # torch/embeddings for the classifier
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mrr-backend-classifier
    command: ["python", "-m", "app.worker", "segment"]
    # One replica serialised every tester behind whoever queued first (measured 2026-07-30: a
    # 427-second unstarted wait behind another user's job). Three matches the tester count; the
    # ceiling is 4, because the binding resource is CPU during OCR on 4 vCPU, not RAM (~2-4 GB for
    # six workers against 13 GB free). Pairs with the per-user lanes in app/worker/queues.py -
    # replicas alone stop helping the moment one user queues more documents than there are workers.
    deploy:
      replicas: 3
    environment: *backend-env
    volumes:
      - mrr_uploads:/app/uploads
      - ./secrets:/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  summarize-worker:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UV_EXTRAS: "--extra docs"
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mrr-backend-web
    command: ["python", "-m", "app.worker", "summarize"]
    # Three replicas, same reasoning as segment-worker above.
    deploy:
      replicas: 3
    environment: *backend-env
    volumes:
      - mrr_uploads:/app/uploads
      - ./secrets:/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    restart: unless-stopped
    build:
      context: ./frontend
    image: mrr-frontend
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:8000
    depends_on:
      - api

  proxy:
    restart: unless-stopped
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  mrr_pgdata:
  mrr_uploads:
