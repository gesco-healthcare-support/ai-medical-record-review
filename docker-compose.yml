# Full deployable stack for the Next.js + FastAPI re-platform: the whole app in one command,
# entirely on local/in-house infrastructure (no cloud). The SAME file runs on the in-house LAN
# server - only .env changes (ENVIRONMENT=prod + TLS on the proxy). The dev-only Postgres/Redis
# for host-process development live in docker-compose.dev.yml; THIS file is the complete app.
#
# The one external call is Vertex AI (LLM/VLM inference); everything else runs on your metal.
#
# Setup / runbook: see docs/plans/2026-07-16-p8-local-stack.md.
name: mrr

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://mrr:${POSTGRES_PASSWORD:-mrr_local_only}@postgres:5432/mrr
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
  SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:?set SECURITY_PASSWORD_SALT in .env (the real Flask salt)}
  UPLOAD_FOLDER: /app/uploads
  GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-true}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  # Pin Tesseract/OpenMP to a single thread. Tesseract 5.x is OpenMP-enabled, and concurrent
  # tesseract processes (the verify pass OCRs boundary pages on up to CLASSIFY_WORKERS threads)
  # deadlock on the shared CPU when this is unset - the reproduced "stuck on verifying" forever-
  # hang. Proven: 6-thread OCR hammer goes 0/60 (deadlock) -> 60/60 with the limit set. Harmless
  # on the api/web tiers (they never OCR).
  OMP_THREAD_LIMIT: "1"
  OMP_NUM_THREADS: "1"
  # Vertex pacing. These MUST be named here to have any effect: compose reads .env only for ${VAR}
  # substitution inside this file, so a key added to .env and not referenced here never reaches a
  # container. Found the hard way on 2026-07-31 - VERTEX_MAX_RPM=20 and SEGMENT_WINDOW_WORKERS=1 were
  # added to the server .env, the containers were recreated, and both processes still reported 60 and
  # 3. Fallbacks mirror app/config.py so an unset key behaves exactly as before.
  VERTEX_MAX_RPM: ${VERTEX_MAX_RPM:-60}
  # The pacer has TWO ceilings and only the request one was reachable, so a token-side squeeze could
  # not be answered without a deploy. Both or neither. Fallback mirrors app/config.py.
  VERTEX_MAX_TPM: ${VERTEX_MAX_TPM:-4000000}
  SEGMENT_WINDOW_WORKERS: ${SEGMENT_WINDOW_WORKERS:-3}
  # Row-level concurrency inside ONE summarize job (summarize_document's ThreadPoolExecutor), and
  # the classify/verify pool. Named here for the same reason as every block in this file: an
  # unreferenced key never reaches a container.
  #
  # PIPELINE_WORKERS is the binding constraint on summarize throughput, not the Vertex quota.
  # Measured 2026-08-03: 7.8 accepted calls/min against a VERTEX_MAX_RPM of 20, i.e. the shared
  # bucket sitting at ~39% utilisation - two concurrent chains at ~15.4s per call is exactly
  # 7.8/min. By Little's Law the saturation point for a 20 rpm budget is 20/60 * 15.4 = ~5
  # concurrent rows, so 5 fills the existing budget without raising it.
  #
  # Do NOT push this far past the saturation point. rate_limit.acquire() abandons its wait after
  # MAX_ACQUIRE_WAIT_S (300s) and proceeds anyway, so enough queued callers stop being rate limited
  # at all. At 3 summarize workers x 5 chains against 20 rpm the mean wait is ~30s, well inside it.
  #
  # CLASSIFY_WORKERS also drives concurrent Tesseract processes in the verify pass - see the
  # OMP_THREAD_LIMIT note above, which is what stops those deadlocking.
  #
  # 2 -> 5, TAKEN on 2026-08-31. This block computed 5 on 2026-08-03 and the value stayed at 2 for
  # four weeks, because raising it exposed the give-up race in `summarize_document` (#154 wrote the
  # change and reverted it). That race was fixed in #155 and the value still did not move, because
  # one full-file run in 18 had failed unexplained. Both are now settled - see app/config.py, which
  # carries the mechanism argument and the 39-run evidence.
  #
  # Its original arithmetic was against VERTEX_MAX_RPM=20; that ceiling is 60 now. Re-measured over
  # the 43 newest summarize jobs: 11.3h for 1,851 summaries = 22.0s per summary at 2 lanes = ~14.7s
  # per call, matching the 15.4s above, so one job draws ~8 calls/min against 60 rpm - about 14%
  # utilisation. Confirmed again on 2026-08-31 against a single fresh 56-row run: 12.7s per call and
  # 16%. 5 stays inside the regime the note measured; its abandon-the-wait failure mode is the reason
  # not to go further.
  #
  # This line is load-bearing: it passes the value explicitly, so a container reads THIS default and
  # never config.py. A test pins the two together.
  PIPELINE_WORKERS: ${PIPELINE_WORKERS:-5}
  CLASSIFY_WORKERS: ${CLASSIFY_WORKERS:-4}
  # Concurrency of the ONE-TIME per-page OCR pass (services/page_text.populate_document). Named here
  # for the same reason as everything above: an unreferenced key never reaches a container.
  #
  # Pure Tesseract CPU, so it is bounded by cores rather than by the Vertex budget - it spends no
  # quota at all. The box has 8 cores and also runs six RQ workers, postgres, redis, api and web, so
  # the default leaves headroom rather than saturating. OMP_THREAD_LIMIT=1 above is what makes
  # several concurrent tesseract processes safe; without it they deadlock on the shared CPU.
  #
  # 4 -> 6 on 2026-08-24, measured: 32 sampled pages OCR'd in 17.0s at 4 threads and 12.7s at 6, with
  # identical character output and no failures. See the note on `page_text_workers` in
  # backend/app/config.py for the full table and why 6 rather than 8.
  #
  # THIS LINE IS LOAD-BEARING, not documentation. It passes the value explicitly, so a container takes
  # this default and NOT the one in config.py - editing only config.py would change nothing on any
  # deployed box. `DUPE_SIMILARITY_OVERRIDE` below WAS exactly that bug: config.py said 0.99
  # while this file said 0.90, so production silently ran 0.90 from #81. CLOSED 2026-08-25 -
  # config.py now says 0.90 as well and records the correction beside the value. Kept as the
  # example because the drift is the point, and because this comment outlived the bug it
  # described and has since been read as live by two people writing PRs against this file.
  PAGE_TEXT_WORKERS: ${PAGE_TEXT_WORKERS:-6}
  # Which vendor answers the summarize stage (body, title, audit). Named here now, while the only
  # valid value is "gemini", so the key is live the day a second provider exists - rather than being
  # added later and silently doing nothing, which is what happened to VERTEX_MAX_RPM and
  # PIPELINE_WORKERS. Fallback mirrors app/config.py.
  SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-gemini}
  # Read ONLY when SUMMARY_PROVIDER=openai. No fallbacks: the app refuses to start if the provider
  # is openai and any of these is unset, because a silent default model is how something unvalidated
  # reaches production. Harmless empty strings while the provider stays gemini.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  SUMMARY_BODY_MODEL: ${SUMMARY_BODY_MODEL:-}
  SUMMARY_TITLE_MODEL: ${SUMMARY_TITLE_MODEL:-}
  AUDIT_MODEL: ${AUDIT_MODEL:-}
  # PHI gate: a signed BAA alone does not permit sending records to OpenAI - Zero Data Retention
  # must also be approved on the ORGANIZATION. Production refuses to start without this explicit
  # acknowledgement, so no future box can start sending records to an org nobody checked.
  OPENAI_ZDR_ACKNOWLEDGED: ${OPENAI_ZDR_ACKNOWLEDGED:-false}
  # Retry budget. Also inert until named here, and .env.example has advertised both since 2026-07-21,
  # so anyone following it would set a value that did nothing. A setting the app reads should be
  # settable: the way to run 8 retries is to put 8 in .env, not to have the file silently ignored.
  # The worker-scaling plan's advice still stands - raising retries above 8 lengthens the block
  # without improving the odds, since a job already burns ~17 minutes before reporting failure - but
  # that is a reason to choose 8, not a reason to hide the dial.
  GENAI_MAX_RETRIES: ${GENAI_MAX_RETRIES:-8}
  GENAI_RETRY_MAX_DELAY: ${GENAI_RETRY_MAX_DELAY:-30}
  # The third retry dial. Its two siblings above were exposed and this one was not, which is exactly
  # how a knob goes unnoticed until someone needs it mid-incident. Fallback mirrors app/config.py.
  GENAI_RETRY_BASE_DELAY: ${GENAI_RETRY_BASE_DELAY:-2.0}
  # How many transient row failures with ZERO successes end a summarize job instead of pausing it into
  # an endless resume cycle. Exposed from the start rather than added later, unlike the four keys
  # below. Raise it only to buy more patience with a flaky endpoint; lowering it below 2 would let a
  # single unlucky row end a job. Fallback mirrors app/config.py.
  SUMMARIZE_GIVEUP_AFTER_FAILURES: ${SUMMARIZE_GIVEUP_AFTER_FAILURES:-3}
  # The four keys below were inert until now, which is the FOURTH time this has happened after
  # VERTEX_MAX_RPM, PIPELINE_WORKERS and the retry budget above. On 2026-08-12 it stopped being a
  # tidiness problem: Vertex refused gemini-2.5-pro for this project entirely (0/8 accepted on the
  # global endpoint, 0-3/8 across five regions, rejections in ~0.1s), every summarize job failed,
  # and SUMMARY_MODEL - the one dial that swaps the model in seconds - did nothing from .env, so the
  # only route out was a code change and a redeploy. Every fallback here mirrors app/config.py, so
  # an unset key behaves EXACTLY as before this commit.
  #
  # SUMMARY_MODEL is the summary BODY model. Note SUMMARY_BODY_MODEL above does NOT cover it: the
  # API resolves the body model from summary_model (api/documents.py:778) and persists it on the Job,
  # so model_for("body") never gets a chance to fire. Empty means app/config.py decides.
  SUMMARY_MODEL: ${SUMMARY_MODEL:-}
  # Thinking budget for the summary body. -1 is dynamic. Exposed alongside SUMMARY_MODEL because the
  # two travel together: swapping model generations is exactly when a thinking setting needs to move,
  # and on 2026-08-13 the body model changed with no way to adjust this. Do NOT also set a thinking
  # LEVEL on a 3.x model - budget and level together are a 400. Fallback mirrors app/config.py.
  SUMMARY_THINKING_BUDGET: ${SUMMARY_THINKING_BUDGET:--1}
  # Where the BODY call lands when Vertex will not serve SUMMARY_MODEL at all - the 2026-08-13
  # situation, where 2.5-pro was refused 0/8 and every summarize job failed. Reached only after the
  # retry seam's budget is spent and the 429 is still coming. Exposed here for the same reason as
  # SUMMARY_MODEL: the escape hatch is worthless if changing it needs a rebuild. "none" disables it
  # and lets the row fail, which is the behaviour before this key existed. Mirrors app/config.py.
  SUMMARY_BODY_FALLBACK_MODEL: ${SUMMARY_BODY_FALLBACK_MODEL:-}
  # The other three models, so ANY of them can be repointed without a code change. On 2026-08-13
  # Vertex stopped admitting gemini-2.5-pro for this project entirely (0/8 on the configured
  # endpoint); SUMMARY_MODEL made that a one-line fix, while these three would have needed a rebuild
  # and a deploy. GENAI_MODEL is segmentation plus the header/DOI reads, VERIFY_MODEL is the
  # boundary verify pass, CLASSIFY_MODEL is categorization.
  #
  # GENAI_MODEL and VERIFY_MODEL fall back to EMPTY on purpose, NOT to a model name: app/config.py
  # derives them (genai_model from use_vertex, verify_model from genai_model) and an empty value is
  # falsy so that derivation still runs. Hardcoding a name here would silently break the chain.
  GENAI_MODEL: ${GENAI_MODEL:-}
  VERIFY_MODEL: ${VERIFY_MODEL:-}
  CLASSIFY_MODEL: ${CLASSIFY_MODEL:-gemini-2.5-flash-lite}
  # Narrow the boundary verify pass to the rows its trigger heuristic selects, instead of every
  # adjacent boundary. Named here BECAUSE it is meant to be flipped on a live box and measured:
  # a setting absent from this block reaches the container only through a rebuild, which is the
  # trap VERIFY_SUSPECT_CAP, VERIFY_USE_TEXT and VERIFY_MERGE are still sitting in.
  #
  # Measured on 28 reviewer-corrected records: every boundary = 57.4% precision / 49.0% recall;
  # triggered only = 60.2% / 45.6% from 31% fewer calls. Precision rises because the dropped
  # boundaries are the ones the oracle was worst on. It costs 8 correct merge suggestions in 117.
  # Ships FALSE - today's behaviour - because it changes what a reviewer is shown.
  VERIFY_TRIGGERED_ONLY: ${VERIFY_TRIGGERED_ONLY:-false}
  # Per-attempt deadline (ms). NOT merely a client-side stall guard: google-genai forwards it to
  # Vertex as the SERVER-side deadline, so exceeding it returns a server 504 DEADLINE_EXCEEDED
  # (proven 2026-08-12 - an 8000 value produced a server 504 at 6.2s). It is therefore the ceiling on
  # how long ONE vision window may take. A 241-page record failed 5/5 that day because its dense
  # windows need longer than 120000; the replacement value is being measured rather than guessed, so
  # this ships at the current default and the raise lands with that measurement.
  GENAI_HTTP_TIMEOUT_MS: ${GENAI_HTTP_TIMEOUT_MS:-120000}
  # How much work one segmentation vision call carries, and therefore whether it fits inside
  # GENAI_HTTP_TIMEOUT_MS. -1 is dynamic thinking, which an A/B showed is what holds strict doc-F1 up
  # (thinking-off over-segments), so if windows run long prefer shrinking WINDOW_BUDGET_MB over
  # disabling thinking.
  SEGMENT_THINKING_BUDGET: ${SEGMENT_THINKING_BUDGET:--1}
  WINDOW_BUDGET_MB: ${WINDOW_BUDGET_MB:-12.5}
  # Hard cap on pages in ONE segmentation vision call. WINDOW_BUDGET_MB bounds request SIZE; this
  # bounds request DURATION, which bytes cannot - a byte-light record packs a huge page count into
  # one budget-sized window, and document 68cb2500 (~52KB/page) put all 241 pages in a single window
  # that needed 179s against a 120s deadline, failing 6/6. Measured 2026-08-12: 160 pages = 54.5s.
  # Raise it to something enormous (e.g. 10000) to disable the cap without a deploy, which is the
  # rollback path for this change. Fallback mirrors app/config.py.
  WINDOW_MAX_PAGES: ${WINDOW_MAX_PAGES:-100}
  # The third window dial, and the one that decides how much left-context each window carries across
  # a seam. It matters more now that WINDOW_MAX_PAGES creates seams that did not exist before, so if
  # over-segmentation shows up at a boundary this is the lever. Fallback mirrors app/config.py.
  WINDOW_OVERLAP: ${WINDOW_OVERLAP:-30}
  # Duplicate-detection thresholds, named here for the same reason as the two blocks above. #66 shipped
  # these three settings and its own body advertised them as the way to loosen or disable the new
  # accuracy gate without a code change - which they were not, since an unreferenced key never reaches
  # a container. It matters for these specifically because the gate decides what a reviewer is SHOWN:
  # if it proves too strict on a real record, editing .env and recreating is the only mitigation that
  # does not need a deploy. Set both overrides to 1.1 to restore the pre-#66 behaviour of sending every
  # candidate to the model. Fallbacks mirror app/config.py, so an unset key behaves exactly as now.
  DUPE_JACCARD_THRESHOLD: ${DUPE_JACCARD_THRESHOLD:-0.70}
  DUPE_SIMILARITY_OVERRIDE: ${DUPE_SIMILARITY_OVERRIDE:-0.90}
  DUPE_MODEL_OVERRIDE: ${DUPE_MODEL_OVERRIDE:-0.95}
  # Grace period before the Stop button offers a hard "Force stop". Named here for the same reason as
  # every block above: an unreferenced key never reaches a container. The API reads it to tell the UI
  # how long to wait, so a mismatch between processes would make the button offer Force stop at a
  # different moment than the server expects.
  JOB_CANCEL_GRACE_SECONDS: ${JOB_CANCEL_GRACE_SECONDS:-10}
  # The RQ budget for one job: job_timeout, or job_timeout_per_page x pages when that is larger. This
  # is the number that hid a failure for 96 minutes on 2026-08-12 - a 289-page record buys
  # 289 x 20s = 5780s, and a fully-refused model spent all of it retrying before reporting anything.
  # Exposed so that budget can be cut during an incident instead of waiting for a deploy.
  # Fallbacks mirror app/config.py.
  JOB_TIMEOUT: ${JOB_TIMEOUT:-3600}
  JOB_TIMEOUT_PER_PAGE: ${JOB_TIMEOUT_PER_PAGE:-20.0}
  # TESSERACT_CMD is deliberately NOT passed through. It is set in .env for the Windows HOST, and
  # injecting a "C:\..." path here would point the containers' pytesseract at a binary that does not
  # exist, breaking OCR everywhere. The Linux images have tesseract on PATH already.

services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: mrr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrr_local_only}
      POSTGRES_DB: mrr
    ports:
      - "5433:5432" # host 5433 to avoid clashing with the dev stack (docker-compose.dev.yml) on 5432
    volumes:
      - mrr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrr -d mrr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7
    # Persistence OFF: the queue carries only non-PHI job ids; no RDB/AOF on disk (HIPAA).
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UV_EXTRAS: "--extra docs"
        # The commit this image is built from, stamped onto every job row so a stored summary can be
        # traced to the code that produced it. Defaults to "unknown" so a local build is honestly
        # labelled rather than mislabelled; deploy sets it (see docs/RUNBOOK.md).
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mrr-backend-web
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    volumes:
      - mrr_uploads:/app/uploads
      - ./instance:/app/instance:ro # the legacy SQLite, read for the one-time data migration
      - ./secrets:/secrets:ro # optional Vertex service-account key (see .env.example)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  segment-worker:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UV_EXTRAS: "--extra docs --extra classifier" # torch/embeddings for the classifier
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mrr-backend-classifier
    command: ["python", "-m", "app.worker", "segment"]
    # One replica serialised every tester behind whoever queued first (measured 2026-07-30: a
    # 427-second unstarted wait behind another user's job). Three matches the tester count; the
    # ceiling is 4, because the binding resource is CPU during OCR on 4 vCPU, not RAM (~2-4 GB for
    # six workers against 13 GB free). Pairs with the per-user lanes in app/worker/queues.py -
    # replicas alone stop helping the moment one user queues more documents than there are workers.
    deploy:
      replicas: 3
    environment: *backend-env
    volumes:
      - mrr_uploads:/app/uploads
      - ./secrets:/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  summarize-worker:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        UV_EXTRAS: "--extra docs"
        GIT_SHA: ${GIT_SHA:-unknown}
    image: mrr-backend-web
    command: ["python", "-m", "app.worker", "summarize"]
    # Three replicas, same reasoning as segment-worker above.
    deploy:
      replicas: 3
    environment: *backend-env
    volumes:
      - mrr_uploads:/app/uploads
      - ./secrets:/secrets:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    restart: unless-stopped
    build:
      context: ./frontend
    image: mrr-frontend
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:8000
    depends_on:
      - api

  proxy:
    restart: unless-stopped
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  mrr_pgdata:
  mrr_uploads:
