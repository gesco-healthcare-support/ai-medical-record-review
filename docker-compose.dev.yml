# Throwaway Postgres + Redis for the backend test suite and host-run development (see
# docs/how-to/run-the-tests.md). The FastAPI app, RQ workers and Next.js run on the host.
# Dev-only: servers run docker-compose.yml, which has its own Postgres and Redis.
services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: mrr
      POSTGRES_PASSWORD: mrr_dev_only
      POSTGRES_DB: mrr
    ports:
      - "5432:5432"
    volumes:
      - mrr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrr -d mrr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # Persistence OFF: the queue carries only non-PHI job identifiers, and we do not want
    # PHI-adjacent job metadata written to an RDB/AOF file (HIPAA). See the plan's PHI scope.
    # A prepared export's `download:<token>` entry also holds its filename - a patient name -
    # for 5 minutes (#389), which is one more reason this must stay memory-only.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

volumes:
  mrr_pgdata:
