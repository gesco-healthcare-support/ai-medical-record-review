name: guard tests

# Unit tests for the promotion guard's decisions, run on the pull request's OWN code. The guard itself
# (promotion-guard.yml) always runs the default branch's copy, so this is the only place a change to it is tested
# before it merges. No paths filter: a required check whose workflow is skipped by one stays pending and blocks the
# merge, and this job takes seconds.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Promotion guard unit tests
        working-directory: .github/scripts
        run: python3 -m unittest -v test_promotion_guard

      # The PR title check (pr-title.yml) runs the script from the pull request itself, so its tests live here too.
      - name: PR title check unit tests
        working-directory: .github/scripts
        run: python3 -m unittest -v test_pr_title

      # The staging acceptance stage's seed script (staging-acceptance.yml): its pure parts are tested here, on every
      # pull request, because the stage itself runs only after a merge into staging.
      - name: Acceptance seed unit tests
        working-directory: .github/scripts
        run: python3 -m unittest -v test_acceptance_seed

      # The release scripts run only on production pull requests and merges, so their logic is tested on every PR.
      - name: Release version and release policy unit tests
        working-directory: .github/scripts
        run: python3 -m unittest -v test_release_version test_release_policy
