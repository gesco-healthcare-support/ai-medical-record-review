name: release

# On each merge into production, publish what shipped. A promotion merges with a merge commit, whose second parent is
# staging's tip: the commit whose images the staging stage built, scanned, attested and pushed to ghcr.io. This job
# verifies those attestations, computes the next semantic version from the commit messages
# (.github/scripts/release_version.py: breaking -> major, feat -> minor, else patch; first release v0.1.0), and
# creates the tag and a GitHub Release: the image digests, then GitHub's generated notes, with each image's SBOM
# attached. Release tags can never be moved or deleted (the `v*` tag ruleset).
on:
  push:
    branches: [production]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
      packages: read
      attestations: read
      actions: read # the staging run's SBOM artifact
    env:
      REGISTRY: ghcr.io/gesco-healthcare-support
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # every tag and commit since the last release

      - name: Find the commit staging accepted
        run: |
          set -euo pipefail
          # `rev-list --parents` prints the commit and its parents: three words for a merge commit.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ]; then
            echo "HEAD is not a promotion merge commit, so there is no accepted staging commit to release."
            exit 1
          fi
          echo "ACCEPTED=$(git rev-parse 'HEAD^2')" >> "$GITHUB_ENV"

      - name: Verify the accepted images and their attestations
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          {
            echo "Images (built, scanned and attested by the staging stage at $ACCEPTED):"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
          } > release-notes.md
          for name in mrr-backend-web mrr-frontend mrr-docs; do
            digest=$(docker buildx imagetools inspect "$REGISTRY/$name:$ACCEPTED" --format '{{json .Manifest}}' \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")
            gh attestation verify "oci://$REGISTRY/$name@$digest" -R "$GITHUB_REPOSITORY"
            echo "| \`$REGISTRY/$name\` | \`$digest\` |" >> release-notes.md
          done
          echo >> release-notes.md

      - name: Compute the version
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ]; then
            version=$(git log "$last..HEAD" --format='%B%x00' | python3 .github/scripts/release_version.py --last-tag "$last")
          else
            version=$(git log HEAD --format='%B%x00' | python3 .github/scripts/release_version.py)
          fi
          echo "Previous release: ${last:-none}; this release: $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Get the SBOMs the staging stage made
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow staging-acceptance.yml --commit "$ACCEPTED" --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful staging stage run for $ACCEPTED."
            exit 1
          fi
          gh run download "$run_id" -n sboms -D sboms

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file release-notes.md --generate-notes sboms/*.spdx.json
