name: CI

# main IS the Next.js + FastAPI rewrite (backend/ + frontend/). This workflow tests that stack:
# the backend suite on real Postgres + Redis with coverage, the frontend unit/component suite,
# and a Playwright E2E pass over the core non-AI flows against the docker-compose app. The legacy
# Flask app (mrr_ai/) is being phased out and is no longer covered here.
# `pull_request` carries NO `branches` filter on purpose. That key filters on the pull
# request's BASE, not its head, so any PR targeting a branch not listed gets NO CI AT ALL -
# it reports mergeable against an empty check set. That is not hypothetical and it is not
# specific to one branch: #391 (into `qwen`), #141 (into `feat/date-vs-human-entries`) and
# #12 (into `experiment/segmentation-pss`) all merged green without the suite ever running.
# Listing target branches only moves the hole, so there is no list. The repo is public, so
# the extra runs cost nothing.
#
# `push` KEEPS a list: without one, pushing a feature branch would run the whole suite a
# second time alongside its own PR run.
on:
  push:
    branches: [main, qwen]
  pull_request:

# Least privilege: every job gets a read-only token unless it asks for more, and none does. Nothing here pushes,
# comments or approves; artifacts travel on the Actions runtime token, not this one.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Same images + credentials as docker-compose.dev.yml; a fresh empty DB that
    # `alembic upgrade head` builds from the baseline, plus Redis for the RQ job-queue tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mrr
          POSTGRES_PASSWORD: mrr_dev_only
          POSTGRES_DB: mrr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mrr -d mrr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The PR's merge commit AND its first parent (the base), for the new-migration diff below.
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install deps (core + docs; no torch)
        run: uv sync --extra docs

      - name: Ruff lint + format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Import smoke (models map, app builds)
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
          SECRET_KEY: ci-import-smoke
          SECURITY_PASSWORD_SALT: ci-import-smoke
        run: uv run python -c "from sqlalchemy.orm import configure_mappers; import app.main; configure_mappers(); print('import OK')"

      # Two PRs that each add a migration both pass on their own and leave main with two heads, which
      # `alembic upgrade head` then refuses on the box. Reading the heads needs no database.
      - name: Migrations have exactly one head
        run: |
          heads=$(uv run --no-sync alembic heads)
          echo "$heads"
          if [ "$(printf '%s\n' "$heads" | grep -c .)" -ne 1 ]; then
            echo "Expected exactly one Alembic head; add a merge revision."
            exit 1
          fi

      # Squawk on the SQL of each migration this PR ADDS (scripts/ci/lint_new_migrations.py says why and how it
      # is tuned). Offline rendering needs settings but no database, hence the placeholder values.
      - name: Lint the SQL of new migrations (Squawk)
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL: postgresql+psycopg://offline:offline@localhost:5432/offline
          SECRET_KEY: ci-offline-sql-only
          SECURITY_PASSWORD_SALT: ci-offline-sql-only
          ENVIRONMENT: dev
        run: uv run --no-sync python scripts/ci/lint_new_migrations.py HEAD^1

      - name: Migrate + run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://mrr:mrr_dev_only@localhost:5432/mrr
          SECRET_KEY: ci-test-secret
          SECURITY_PASSWORD_SALT: ci-test-salt
          ENVIRONMENT: dev
        # Three workers on the runner's 4 vCPUs (pytest-xdist). Measured 2026-09-24 on draft #399, two
        # rounds of 3 samples: -n 3 beat -n 4 by ~5-8s a run, because each worker repeats start-up and
        # collection under coverage and they contend for the CPUs. Each worker has its own copy of the test
        # database, its own test-user prefix and its own Redis database (tests/conftest.py). `--dist
        # loadfile` keeps every file on one worker; its first reason (fixed-id rows in one shared database)
        # went away with the per-worker databases, and `--dist load` has not been measured. pytest-cov
        # combines the workers' coverage, so coverage.xml - and the coverage-floor gate - is unchanged. A
        # plain local `pytest` stays serial.
        run: |
          uv run alembic upgrade head
          # Fails when the models need a migration nobody wrote (alembic 1.9+).
          uv run alembic check
          uv run pytest -n 3 --dist loadfile --cov=app --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Upload backend coverage
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 1

  # Reports pyright's errors on backend/app without blocking a merge. The count is brought to zero one
  # cause per pull request; at zero the check becomes a required step of `backend`. pyright is pinned
  # like zizmor: a new release can add checks, which should arrive as a reviewed bump.
  backend-types:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install deps (core + docs; no torch)
        run: uv sync --extra docs

      - name: pyright (report only)
        run: |
          set +e
          uvx pyright==1.1.414 > pyright.txt
          status=$?
          cat pyright.txt
          echo "### pyright on backend/app (report only)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 pyright.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # ESLint (Next's core-web-vitals + typescript rules); any error or warning fails the job, and so the
      # required `frontend` check. Config: frontend/eslint.config.mjs.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (authoritative production build)
        run: pnpm build

      - name: Unit + component tests with coverage
        run: pnpm test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          # Both files share the ancestor frontend/coverage, so they land at the artifact root
          # exactly as the single file did - the sonarcloud job's download + SF-path rewrite below
          # is unaffected. coverage-summary.json is here because lcov carries no statements metric
          # and the coverage floor gates all four.
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    # Boot the real app stack (proxy + api + web + Postgres + Redis) and run Playwright against it.
    # The torch segment/summarize workers and Vertex are intentionally NOT started: CI cannot run
    # Vertex (auth/quota/no-BAA), so the AI identify/summarize flows stay live-manually-verified.
    env:
      SECRET_KEY: ci-e2e-secret-key-that-is-at-least-32-bytes
      SECURITY_PASSWORD_SALT: ci-e2e-salt
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Build app images (api + web only; no torch workers)
        run: docker compose build api web

      - name: Start Postgres + Redis
        run: docker compose up -d --wait postgres redis

      - name: Migrate the database
        run: docker compose run --rm api alembic upgrade head

      - name: Start api + web + proxy
        run: docker compose up -d --wait api web proxy

      - name: Wait for the app to be ready (web AND api)
        run: |
          # The web probe (nginx -> Next) alone does not prove uvicorn has bound :8000, and the
          # first E2E action POSTs to /api immediately. Require both: /login served AND the api's
          # /health OK (probed inside the container, since nginx routes / to web not the api).
          for _ in $(seq 1 60); do
            web=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/login 2>/dev/null || true)
            if [ "$web" = "200" ] && docker compose exec -T api \
                 python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)" 2>/dev/null; then
              echo "web + api ready"
              exit 0
            fi
            sleep 2
          done
          echo "app did not become ready on :8080"
          docker compose logs --no-color proxy web api
          exit 1

      - name: Install frontend deps + Playwright browser
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run E2E specs
        working-directory: frontend
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 3

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks GitHub Action requires a paid license for organizations; the
      # gitleaks OSS binary does not. Pinned to the same version as the pre-commit hook.
      - name: gitleaks (OSS binary)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact --no-banner --exit-code 1

  # The documentation site (docs-site/), built exactly as the `docs` image builds it. --strict turns
  # every warning into a failure: a broken link, a missing anchor, or a page under docs/ that is not
  # in mkdocs.yml's nav. That is the check that stops the docs from drifting away from each other.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install the site tooling (locked)
        run: uv sync --frozen

      - name: Build the site (strict)
        run: uv run --frozen mkdocs build --strict

  # Lints the workflows themselves: actionlint for syntax and expression mistakes, zizmor for security
  # problems (injection, excess permissions, unpinned actions, dangerous triggers). The pipeline is an
  # attack path - in March 2026, 76 of 77 trivy-action tags were force-pushed to credential stealers - so
  # both tools are pinned: actionlint to a release checked against its published sha256, zizmor to an
  # exact version.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: actionlint (pinned release, checksum verified)
        env:
          VERSION: "1.7.12"
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSL --fail -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" actionlint
          ./actionlint -color

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: zizmor (pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.30.1 --persona regular .github/workflows/

  # Dependency gate, PR half 1. Fails a PR that ADDS or upgrades to a runtime dependency with a known high or
  # critical vulnerability, using GitHub's advisory database and the PR's own dependency diff - so an advisory
  # published against an OLD dependency never fails an unrelated PR. Runtime scope only: dev tooling is not
  # shipped. PR-only; on a push this job is skipped.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: never

  # Dependency gate, PR half 2. OSV-Scanner reads both lockfiles directly (uv.lock included, which GitHub's
  # dependency graph does not list as a supported format), scans the base and the PR, and fails only on
  # vulnerabilities the PR INTRODUCES. The reusable workflow's own job asks for security-events: write (it uploads
  # its SARIF to code scanning), so this job must grant it; nothing else here gets it.
  osv-scan:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=./backend/uv.lock
        --lockfile=./frontend/pnpm-lock.yaml

  # Coverage floor. A SEPARATE job so a shortfall reads as "coverage" rather than as a test job
  # failing. Two halves, one job - so the ruleset needs ONE check name to enforce both:
  #   backend   90, on coverage.py's branch-aware total (one number)
  #   frontend  80, on EACH of statements, branches, functions and lines (four numbers)
  # The frontend half landed in Phase 5 Task 9, once frontend coverage cleared 80 on all four - a
  # floor above today's number would make this permanently red, which teaches people to ignore it.
  #
  # A REQUIRED CHECK: the `main` ruleset (active) lists `coverage-floor` among its required status
  # checks, so a shortfall blocks the merge. See docs/reference/ci-and-merge-gates.md.
  #
  # Fails CLOSED, mirroring the SonarCloud step below: a gate that reads a missing, empty or
  # unparseable report and reports success is worse than no gate, because it looks like protection.
  # The measurement is proved to exist before any number is read from it.
  #
  # Backend: coverage.py's branch-aware total, (covered lines + covered branches) /
  # (valid lines + valid branches) - which is why the backend step passes --cov-branch. Read it from
  # the ARTIFACT pytest-cov produced; regenerating from a .coverage data file does NOT reproduce it.
  #
  # Frontend: from coverage-summary.json's integer covered/total counts, compared as integers
  # (covered * 100 >= floor * total). Never from `pct` or the text table: those are rounded and
  # truncated, so 79.996% would print as 80.00 and pass. A skipped job is not a passed one - if the
  # frontend or backend job fails, this is skipped, and that job's own failure is what blocks.
  coverage-floor:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: backend-coverage
          path: backend

      - name: Backend coverage must not fall below the floor
        env:
          FLOOR: "90"
        run: |
          set -euo pipefail
          f=backend/coverage.xml
          if [ ! -s "$f" ]; then
            echo "No coverage report at $f."
            echo "Refusing to report a floor from a measurement that does not exist."
            exit 1
          fi
          python3 - "$f" "$FLOOR" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          path, floor = sys.argv[1], float(sys.argv[2])
          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              sys.exit(f"coverage.xml did not parse ({exc}) - failing rather than passing blind.")
          need = ("lines-covered", "lines-valid", "branches-covered", "branches-valid")
          missing = [k for k in need if k not in root.attrib]
          if missing:
              sys.exit(f"coverage.xml lacks {missing}; cannot compute a branch-aware total.")
          lc, lv = int(root.attrib["lines-covered"]), int(root.attrib["lines-valid"])
          bc, bv = int(root.attrib["branches-covered"]), int(root.attrib["branches-valid"])
          if lv + bv == 0:
              sys.exit("coverage.xml reports zero measurable lines and branches - empty report.")
          pct = 100.0 * (lc + bc) / (lv + bv)
          print(f"backend coverage {pct:.2f}%  ({lc} + {bc}) / ({lv} + {bv})  floor {floor:.0f}%")
          if pct < floor:
              sys.exit(f"BELOW THE FLOOR: {pct:.2f}% < {floor:.0f}%")
          print("above the floor")
          PYEOF

      - name: Download frontend coverage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Frontend coverage must not fall below the floor
        env:
          FLOOR: "80"
        run: |
          set -euo pipefail
          f=frontend/coverage/coverage-summary.json
          if [ ! -s "$f" ]; then
            echo "No coverage summary at $f."
            echo "Refusing to report a floor from a measurement that does not exist."
            exit 1
          fi
          python3 - "$f" "$FLOOR" <<'PYEOF'
          import json, sys
          path = sys.argv[1]
          try:
              floor = int(sys.argv[2])
          except ValueError:
              sys.exit(f"FLOOR must be a whole percentage, got {sys.argv[2]!r}.")
          try:
              with open(path, encoding="utf-8") as fh:
                  doc = json.load(fh)
          except Exception as exc:
              sys.exit(f"coverage-summary.json did not parse ({exc!r}) - failing rather than passing blind.")
          total = doc.get("total") if isinstance(doc, dict) else None
          if not isinstance(total, dict):
              sys.exit("coverage-summary.json lacks a total object; cannot read the four metrics.")
          below = []
          for metric in ("statements", "branches", "functions", "lines"):
              entry = total.get(metric)
              covered = entry.get("covered") if isinstance(entry, dict) else None
              valid = entry.get("total") if isinstance(entry, dict) else None
              # `type(...) is int`: a float would be silently truncated by int(), and json-summary's
              # "Unknown" (its pct for an empty total) must not be read as a number at all.
              if type(covered) is not int or type(valid) is not int:
                  sys.exit(f"coverage-summary.json lacks a usable {metric} count ({entry!r}).")
              if valid <= 0:
                  sys.exit(f"coverage-summary.json reports zero measurable {metric} - empty report.")
              ok = covered * 100 >= floor * valid
              needed = -(-floor * valid // 100)
              print(f"frontend {metric:<10} {100.0 * covered / valid:6.2f}%  {covered} / {valid}"
                    f"  floor {floor}%  headroom {covered - needed:+d}  {'ok' if ok else 'BELOW'}")
              if not ok:
                  # Counts, not a percentage: a rounded 80.00% "below" 80% reads as a contradiction.
                  below.append(f"{metric} {covered}/{valid} needs {needed}, {needed - covered} short")
          if below:
              sys.exit(f"BELOW THE FLOOR ({floor}%): {'; '.join(below)}")
          print("frontend above the floor on all four")
          PYEOF

  # Separate job so a quality-gate failure reads as "sonarcloud", not "tests". Consumes the
  # coverage reports produced by the backend + frontend jobs.
  sonarcloud:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history improves SonarCloud reporting relevance

      - name: Download backend coverage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Monorepo path fix: the reports carry module-relative paths that do NOT resolve against
      # sonar.sources from the repo root, so Sonar would silently import ZERO coverage (an inert
      # gate). Rewrite the paths to repo-root-relative before the scan.
      - name: Normalize coverage report paths to repo root
        run: |
          # backend coverage.xml: <source>app</source> + filename="config.py" -> backend/app/config.py
          sed -i 's#<source>app</source>#<source>backend/app</source>#' backend/coverage.xml
          # frontend lcov: SF paths are relative to frontend/ (e.g. SF:lib/..) -> prefix frontend/
          sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The quality gate cannot enforce "no new issues" on this plan, so it is enforced here.
      #
      # "Sonar way" is BUILT-IN and will not accept extra conditions, and associating a custom gate
      # with a project is a paid feature - the project's own Quality Gate page says so outright. That
      # leaves six rating/ratio conditions, none of which can fail on a low-effort maintainability
      # finding: the maintainability rating is a debt RATIO (A is <= 5%), so a one-minute issue
      # cannot move it. That is how python:S5799 was reintroduced on 2026-09-03 with every check
      # green, after bucket 2 had cleared it to zero.
      #
      # Runs after the scan, which already waits for analysis (sonar.qualitygate.wait=true), so the
      # issue list is final. No token needed: the project is public. Fails CLOSED - an unreadable
      # response blocks rather than passing blind, since a silent pass is the exact failure this
      # step exists to remove.
      #
      # THREE WAYS THIS STEP USED TO PASS WITHOUT MEASURING ANYTHING. All three were reproduced
      # against the live API on 2026-09-09, and all three are closed below.
      #
      #   1. api/issues/search answers HTTP 200 with {"total":0} for a pullRequest that does not
      #      exist, AND for a componentKeys that does not exist. Both were confirmed by hand. So a
      #      zero proves nothing on its own: a typo in PROJECT, an empty PR_NUMBER, or an analysis
      #      that was never stored all read as "clean". The analysis is now proven to exist first.
      #   2. Nothing tied the analysis to the commit under test, so re-running only this job could
      #      pass on a stale analysis of an earlier push. The analysed commit sha is now compared to
      #      the PR head sha. Verified these two agree in practice on PR #273 before relying on it.
      #   3. Security hotspots are a separate finding type on a separate endpoint, and are never
      #      returned by issues/search. A new hotspot passed this step entirely.
      #
      # Note the endpoints behave DIFFERENTLY on a bad key and must not be treated alike:
      # api/hotspots/search fails closed (HTTP 404 with an error body) where api/issues/search does
      # not. Everything below branches on curl's exit status via --fail-with-body, never on the
      # shape of a response body.
      - name: Fail on any new SonarCloud issue in this PR
        if: github.event_name == 'pull_request'
        env:
          PROJECT: gesco-healthcare-support_ai-medical-record-review
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          # --fail-with-body: non-zero exit on an HTTP error, while still printing the body so the
          # log says why. set -e then stops the step rather than letting it read an error as data.
          api() { curl -sS --fail-with-body --retry 3 --retry-delay 5 "$1"; }

          # 1. The analysis must exist, and it must be THIS RUN'S. The proof is the scanner's own
          # report: the scan step above writes the compute-engine task it submitted to
          # .scannerwork/report-task.txt, and api/ce/task says whether that task finished and for
          # which pull request. That closes both old holes at once - an analysis that was never
          # stored cannot have a SUCCESS task, and a task submitted by this job cannot describe an
          # earlier push.
          #
          # This replaced a lookup in api/project_pull_requests/list, which STOPPED UPDATING on
          # 2026-09-23 (frozen at #388, 185 entries, every page and ps value alike) while every
          # scan after it succeeded and passed its Quality Gate. Each PR then failed here with "no
          # analysis", including PRs with zero issues - a check that fails every PR says nothing.
          # The list is still consulted for the commit, below, whenever it does carry the PR.
          task_file=.scannerwork/report-task.txt
          if [ ! -f "$task_file" ]; then
            echo "The scan left no ${task_file}, so there is no analysis of this run to check."
            exit 1
          fi
          task_id=$(sed -n 's/^ceTaskId=//p' "$task_file")
          if [ -z "$task_id" ]; then
            echo "${task_file} names no ceTaskId - failing rather than passing blind."
            exit 1
          fi
          # A header held in a variable rather than `curl -u`: gitleaks reads any inline `-u "x:"`
          # as a committed credential (rule curl-auth-user), even when x is a secret reference.
          sonar_auth="Authorization: Bearer ${SONAR_TOKEN}"
          task=$(curl -sS --fail-with-body --retry 3 --retry-delay 5 -H "$sonar_auth" \
            "https://sonarcloud.io/api/ce/task?id=${task_id}")
          task_status=$(printf '%s' "$task" | jq -r '.task.status // ""')
          task_pr=$(printf '%s' "$task" | jq -r '.task.pullRequest // ""')
          if [ "$task_status" != "SUCCESS" ] || [ "$task_pr" != "$PR_NUMBER" ]; then
            echo "SonarCloud task ${task_id} is '${task_status:-unknown}' for PR '${task_pr:-none}',"
            echo "not a finished analysis of PR ${PR_NUMBER}. Refusing to report 'no new issues'."
            exit 1
          fi

          # 2. Belt and braces: the pull request's own component must exist. measures/component
          # answers 404 for a pull request SonarCloud has never analysed (checked by hand against
          # a made-up number), unlike issues/search, which answers {"total":0}.
          api "https://sonarcloud.io/api/measures/component?component=${PROJECT}&pullRequest=${PR_NUMBER}&metricKeys=new_violations" > /dev/null

          # 3. Where the pull-request list does carry this PR, its commit must be the one under
          # test - the stale-analysis guard, kept for when the list is current.
          prs=$(api "https://sonarcloud.io/api/project_pull_requests/list?project=${PROJECT}")
          analysed=$(printf '%s' "$prs" | jq -r --arg k "$PR_NUMBER" \
            '[.pullRequests[]? | select(.key == $k)] | .[0].commit.sha // ""')
          if [ -n "$analysed" ] && [ "$analysed" != "$HEAD_SHA" ]; then
            echo "SonarCloud analysed ${analysed}, but this PR's head is ${HEAD_SHA}."
            echo "Re-run the SonarQube Cloud scan so the issue list describes the code under test."
            exit 1
          fi

          issues=$(api "https://sonarcloud.io/api/issues/search?componentKeys=${PROJECT}&pullRequest=${PR_NUMBER}&resolved=false&ps=500")
          total=$(printf '%s' "$issues" | jq -r '.total // "unreadable"')
          if [ "$total" = "unreadable" ]; then
            echo "Could not read the issue count from SonarCloud - failing rather than passing blind."
            printf '%s' "$issues" | head -c 500
            exit 1
          fi

          # 3. Hotspots, which issues/search never returns.
          hotspots=$(api "https://sonarcloud.io/api/hotspots/search?projectKey=${PROJECT}&pullRequest=${PR_NUMBER}&status=TO_REVIEW&ps=500")
          hot=$(printf '%s' "$hotspots" | jq -r '.paging.total // "unreadable"')
          if [ "$hot" = "unreadable" ]; then
            echo "Could not read the hotspot count from SonarCloud - failing rather than passing blind."
            printf '%s' "$hotspots" | head -c 500
            exit 1
          fi

          failed=0
          if [ "$total" -gt 0 ]; then
            echo "This PR introduces ${total} new SonarCloud issue(s):"
            printf '%s' "$issues" | jq -r '.issues[] | "  " + .rule + "  " + (.component | sub("^[^:]+:"; "")) + ":" + ((.line // "-") | tostring) + "  " + .message'
            failed=1
          fi
          if [ "$hot" -gt 0 ]; then
            echo "This PR introduces ${hot} security hotspot(s) awaiting review:"
            printf '%s' "$hotspots" | jq -r '.hotspots[] | "  " + .ruleKey + "  " + (.component | sub("^[^:]+:"; "")) + ":" + ((.line // "-") | tostring) + "  " + .message'
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Fix each one, or mark it in SonarCloud with a reason, then re-run this job."
            exit 1
          fi

          echo "No new SonarCloud issues or hotspots in PR ${PR_NUMBER} (analysis of ${analysed})."
